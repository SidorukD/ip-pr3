<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шапка сайта на Grid</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: linear-gradient(180deg, #c0e0e4 0%, #a3ccd1 100%);
        font-family: Arial, sans-serif;
        padding-top: 50px;
        min-height: 100vh;
    }

    header {
        display: grid;
        grid-template-columns: 200px 1fr 200px;
        grid-template-areas:
            "logo search login"
            ". options .";
        row-gap: 15px;
        column-gap: 20px;
        max-width: 1100px;
        margin: 0 auto;
        align-content: start;
    }

    .logo {
        grid-area: logo;
        background-color: #56b86b;
        height: 60px;
    }

    .search {
        grid-area: search;
        display: flex;
        height: 60px;
    }

    .search__input {
        flex-grow: 1;
        border: none;
        padding: 0 20px;
        font-size: 18px;
        outline: none;
    }

    .search__button {
        background-color: #d97d9e;
        color: #000;
        border: none;
        padding: 0 30px;
        font-size: 18px;
        cursor: pointer;
    }

    .options {
        grid-area: options;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .opions__button {
        background-color: #487ab7;
        color: #fff;
        border: none;
        height: 50px;
        font-size: 18px;
        cursor: pointer;
    }

    .login {
        grid-area: login;
        background-color: #56b86b;
        height: 60px;
    }
</style>
</head>
<body>
<header>
<div class="logo"></div>
<form class="search">
<input class="search__input" type="text" placeholder="Поиск">
<button class="search__button" type="submit">Найти</button>
</form>
<div class="options">
<button class="opions__button">1</button>
<button class="opions__button">2</button>
<button class="opions__button">3</button>
<button class="opions__button">4</button>
</div>
<div class="login"></div>
</header>
</body>
</html>
